<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14141a;
    --panel: #1e1e26;
    --panel-edge: #2a2a34;
    --key: #24242e;
    --key-hi: #2e2e3a;
    --key-text: #e8e6f0;
    --op: #ff8a3d;
    --op-text: #1a1006;
    --display-fg: #ffcf9e;
    --muted: #6f6d7e;
    --danger: #ff5c5c;
    font-family: 'Manrope', sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #e9e6df;
      --panel: #f4f1ea;
      --panel-edge: #d8d3c7;
      --key: #ffffff;
      --key-hi: #fbfaf7;
      --key-text: #2a2a2a;
      --op: #d9772f;
      --op-text: #fff8f0;
      --display-fg: #7a4b17;
      --muted: #8a8778;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    min-height: 100%;
  }
  .calc {
    width: 100%;
    max-width: 340px;
    background: linear-gradient(160deg, var(--panel), var(--panel-edge));
    border-radius: 28px;
    padding: 22px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .display {
    position: relative;
    background: #0c0c10;
    border-radius: 18px;
    padding: 26px 20px 18px;
    margin-bottom: 18px;
    overflow: hidden;
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.6);
  }
  .display::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
  }
  .expr {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--muted);
    min-height: 18px;
    text-align: right;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .result {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 42px;
    color: var(--display-fg);
    text-align: right;
    text-shadow: 0 0 18px color-mix(in srgb, var(--display-fg) 55%, transparent);
    line-height: 1.15;
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: opacity 0.08s ease;
  }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  button {
    appearance: none;
    border: none;
    border-radius: 16px;
    background: var(--key);
    color: var(--key-text);
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 19px;
    padding: 18px 0;
    cursor: pointer;
    box-shadow:
      0 3px 0 rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.06);
    transition: transform 0.06s ease, box-shadow 0.06s ease, background 0.15s ease;
  }
  button:hover { background: var(--key-hi); }
  button:active {
    transform: translateY(3px);
    box-shadow: 0 0 0 rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .op {
    background: var(--op);
    color: var(--op-text);
    box-shadow: 0 3px 0 color-mix(in srgb, var(--op) 65%, black), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .op:hover { filter: brightness(1.06); }
  .op:active { box-shadow: 0 0 0 rgba(0,0,0,0.3); }
  .fn { color: var(--danger); }
  .zero { grid-column: span 2; }
  :focus-visible { outline: 2px solid var(--op); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
</style>
</head>
<body>
  <div class="calc">
    <div class="display">
      <div class="expr" id="expr">&nbsp;</div>
      <div class="result" id="result">0</div>
    </div>
    <div class="keys">
      <button class="fn" data-action="clear">C</button>
      <button class="fn" data-action="back">⌫</button>
      <button class="fn" data-action="percent">%</button>
      <button class="op" data-op="÷">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="op" data-op="×">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="op" data-op="−">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="op" data-op="+">+</button>

      <button class="zero" data-num="0">0</button>
      <button data-num=".">.</button>
      <button class="op" data-action="equals">=</button>
    </div>
  </div>

<script>
(function () {
  const exprEl = document.getElementById('expr');
  const resultEl = document.getElementById('result');
  const OP_MAP = { '÷': '/', '×': '*', '−': '-', '+': '+' };

  let expr = '';       // display string, e.g. "12 × 4"
  let evaluated = false;

  function fmt(n) {
    if (!isFinite(n)) return 'Error';
    const s = Number(n.toPrecision(12)).toString();
    return s.length > 14 ? Number(n).toExponential(4) : s;
  }

  function evaluateExpr(str) {
    const ascii = str.replace(/[÷×−]/g, ch => OP_MAP[ch]).trim();
    if (!/^[0-9+\-*/.%\s]*$/.test(ascii)) throw new Error('bad input');
    const tail = ascii.replace(/[+\-*/.]\s*$/, '');
    if (!tail.trim()) return 0;
    return Function('"use strict";return (' + tail + ')')();
  }

  function render() {
    exprEl.textContent = expr ? expr : '\u00A0';
    if (expr === '') { resultEl.textContent = '0'; return; }
    try {
      resultEl.textContent = fmt(evaluateExpr(expr));
    } catch (e) {
      // incomplete expression mid-entry: keep last valid preview
    }
  }

  function pressNum(d) {
    if (evaluated) { expr = ''; evaluated = false; }
    const lastToken = expr.split(/\s/).pop();
    if (d === '.' && lastToken.includes('.')) return;
    expr += d;
    render();
  }

  function pressOp(opChar) {
    if (expr === '' && opChar !== '−') return;
    evaluated = false;
    if (/\s[÷×−+]\s$/.test(expr)) {
      // already ends with " <op> " — swap it instead of stacking a second one
      expr = expr.slice(0, -3) + ' ' + opChar + ' ';
    } else {
      expr += (expr === '' ? '' : ' ') + opChar + ' ';
    }
    render();
  }

  function pressEquals() {
    if (expr === '') return;
    try {
      const val = evaluateExpr(expr);
      resultEl.textContent = fmt(val);
      expr = fmt(val);
      exprEl.textContent = '\u00A0';
      evaluated = true;
    } catch (e) {
      resultEl.textContent = 'Error';
    }
  }

  function pressClear() {
    expr = '';
    evaluated = false;
    render();
  }

  function pressBack() {
    if (evaluated) { pressClear(); return; }
    expr = /\s[÷×−+]\s$/.test(expr) ? expr.slice(0, -3) : expr.slice(0, -1);
    render();
  }

  function pressPercent() {
    const m = expr.match(/(-?\d+\.?\d*)\s*$/);
    if (!m) return;
    const num = parseFloat(m[1]) / 100;
    expr = expr.slice(0, m.index) + fmt(num);
    render();
  }

  document.querySelector('.keys').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    if (btn.dataset.num !== undefined) pressNum(btn.dataset.num);
    else if (btn.dataset.op) pressOp(btn.dataset.op);
    else if (btn.dataset.action === 'equals') pressEquals();
    else if (btn.dataset.action === 'clear') pressClear();
    else if (btn.dataset.action === 'back') pressBack();
    else if (btn.dataset.action === 'percent') pressPercent();
  });

  window.addEventListener('keydown', (e) => {
    if (/[0-9.]/.test(e.key)) pressNum(e.key);
    else if (['+','-','*','/'].includes(e.key)) {
      const rev = { '+':'+', '-':'−', '*':'×', '/':'÷' };
      pressOp(rev[e.key]);
    }
    else if (e.key === 'Enter' || e.key === '=') pressEquals();
    else if (e.key === 'Backspace') pressBack();
    else if (e.key === 'Escape') pressClear();
    else if (e.key === '%') pressPercent();
  });

  render();
})();
</script>
</body>
</html>
